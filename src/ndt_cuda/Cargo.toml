[package]
name = "ndt_cuda"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CubeCL-based CUDA NDT scan matching"

[dependencies]
# CubeCL for GPU compute
# Note: Version 0.9.0-pre has significant API changes requiring major refactoring.
# Staying on 0.8.x until the migration is scheduled work.
#
# Checked 2026-08-22 whether newer dependencies gained a proper CUDA version
# check, hoping to retire the cudarc017 pin below: they have not. cudarc
# 0.19.9 (latest) still detects by running `nvcc --version` and still assumes
# the newest supported CUDA under fallback-latest when that fails; cubecl 0.9
# and 0.10 both still request cuda-version-from-build-system + fallback-latest.
# Explicit cuda-* features still take precedence over detection in every
# cudarc from 0.17 through 0.19 (verified in each build.rs), so the pin
# strategy keeps working across upgrades.
#
# Worth knowing for the eventual migration: cubecl 0.9 moves to cudarc 0.18 --
# the SAME major this crate already pins -- so the two copies unify into one
# crate node whose feature union includes our explicit cuda-12030, and the
# renamed cudarc017 dependency can be deleted outright. cubecl 0.10 moves to
# cudarc 0.19 and would need the pin re-declared at 0.19.
cubecl = { version = "0.8", features = ["cuda"] }

# cudarc for cuSOLVER (GPU Newton solve)
#
# The version feature selects which symbols cudarc's generated bindings declare,
# and with dynamic-loading it resolves all of them when the library is opened,
# not when they are called. One symbol missing from the host's libcusolver is
# therefore a panic on first use, however unrelated that symbol is to the calls
# this crate makes:
#
#     Expected symbol in library: DlSym { desc:
#     "libcusolver.so.11: undefined symbol: cusolverDnXlarft" }
#
# So the feature has to name the OLDEST CUDA this crate must run against, not
# the newest available. Two constraints set that floor:
#
# - Jetson AGX Orin ships CUDA 12.6, but the Tegra driver omits
#   cuEventElapsedTime_v2 (needed by cuda-12080+) and cusolverDnXgeev
#   (needed by cuda-12060+).
# - The x86 development host builds against CUDA 12.3, which lacks
#   cusolverDnXlarft (needed by cuda-12050+).
#
# cuda-12030 satisfies both. This crate only calls potrf/potrs/getrf from the
# legacy dense API, present since CUDA 11, so nothing here needs a later
# binding set.
# cubecl-cuda pulls its OWN cudarc (0.17.x) with cuda-version-from-build-system
# and fallback-latest. When nvcc is off PATH at build time (CI, bare shells),
# that fallback silently assumes CUDA 13.0 -- and with dynamic-loading, the
# resulting binary demands driver symbols the Tegra driver does not export
# (cuCtxGetDevice_v2 is gated on cuda-13000) and panics at startup. And the
# wrong answer is cached: PATH is not in cargo's fingerprint.
#
# cudarc's build script checks explicit cuda-* features BEFORE build-system
# detection, so this renamed dep exists solely to force the 0.17 copy onto an
# explicit floor.
#
# ── 2026-08-30: the floor is 12030, and the build-dependencies block below ──
# ── is what makes it hold ───────────────────────────────────────────────────
#
# An earlier revision raised this pin to 12080 to fix a build failure:
#
#     error[E0432]: unresolved imports `cudarc::driver::sys::CUtensorMapIm2ColWideMode`,
#                   `cudarc::driver::sys::cuTensorMapEncodeIm2colWide`
#     error[E0425]: cannot find value `CU_TENSOR_MAP_DATA_TYPE_16U4_ALIGN8B`
#
# That was the wrong fix, and it is reverted. The pin was never the cause, and
# raising it traded a build failure for a WORSE failure: cuda-12080 declares
# cuEventElapsedTime_v2, the Tegra driver does not export it (verified with
# `nm -D` on JetPack 6.2 / R36.4.4), and dynamic-loading resolves every declared
# symbol in Lib::from_library() with .expect(). So 12080 loads nowhere on the
# Orin -- it panics at startup instead of failing to compile.
#
# THE ACTUAL CAUSE. cubecl-cuda 0.8.1 does not reference the 12.8 tensormap API
# unconditionally. Every site is gated on `#[cfg(cuda_12080)]`, with a
# `#[cfg(not(cuda_12080))]` fallback beside it, so the crate fully supports
# older CUDA. That cfg is set by cubecl-cuda's OWN build script, from
# `cudarc::driver::sys::CUDA_VERSION` as seen by its BUILD-DEPENDENCY copy of
# cudarc -- a different copy from the one pinned here. That copy carries
# cuda-version-from-build-system + fallback-latest, so it runs `nvcc --version`
# and, when nvcc is off PATH, silently assumes CUDA 13.0.
#
# The build then compiles cubecl-cuda's 12.8 branch against the normal copy of
# cudarc, which is pinned here and does not declare those symbols. The two
# copies disagree and the crate does not compile. Reproduced exactly: with nvcc
# on PATH the 12030 pin compiles clean; with nvcc removed from PATH the same
# tree produces the two errors above. Cargo's v2 resolver keeps build-dependency
# features separate from normal ones, which is precisely why pinning this copy
# could not reach the other one.
#
# THE FIX is the [build-dependencies] block at the bottom of this file, which
# pins that second copy to the same floor. CUDA_VERSION is then 12030 on every
# host, cuda_12080 is never set, cubecl-cuda compiles its fallback branch, and
# no 12.8 symbol is demanded at load time. PATH stops mattering, which also
# retires the "wrong answer is cached, PATH is not in cargo's fingerprint" trap
# noted above -- an explicit feature is in the fingerprint.
#
# Downgrading to cubecl 0.8.0 was also tried and is not needed: it resolves
# cudarc 0.17.8 with TWO cuda-* features enabled at once and fails with ~106
# "defined multiple times" errors.
cudarc017 = { package = "cudarc", version = "0.17", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-12030",
] }

cudarc = { version = "0.18", default-features = false, features = [
    "std",
    "driver",
    "cusolver",
    "dynamic-loading",
    "cuda-12030",
] }

# CUB radix sort via FFI
cuda_ffi = { path = "../cuda_ffi" }

# Linear algebra
nalgebra.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging (tracing for ROS-independent library; cuda_ndt_matcher uses rclrs logging)
tracing = "0.1"

# Parallel CPU (for reference implementation)
rayon = "1.10"

# KD-tree for voxel centroid radius search
kiddo = "4"

# Serialization for debug output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Testing
rand.workspace = true
rand_distr.workspace = true
approx.workspace = true

[features]
default = ["cuda"]
cuda = []

# === Debug Features ===
# Enable detailed timing instrumentation for profiling
profiling = []
# Enable per-iteration optimization data collection (pose, score, gradient, Hessian)
debug-iteration = []
# Enable GPU vs CPU covariance comparison during voxel grid construction
debug-cov = []
# Enable voxel-per-point distribution tracking
debug-vpp = []
# Convenience alias for all debug features
debug = ["debug-iteration", "debug-cov", "debug-vpp", "profiling"]

# Enable verbose debug output in tests (println! statements)
test-verbose = []

# Forces cubecl-cuda's build-dependency copy of cudarc onto the same explicit
# CUDA floor as the normal copy pinned above. See the long note there, and
# build.rs, which exists only so that this block is resolved at all.
#
# Keep the version in these features identical to the cudarc017 pin above.
[build-dependencies]
cudarc017 = { package = "cudarc", version = "0.17", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-12030",
] }
